        function formatDateThai(isoString) {
            if(!isoString) return '';
            const d = new Date(isoString);
            return `${d.getDate()} ${d.toLocaleString('th-TH', { month: 'short' })} ${d.getFullYear() + 543}`;
        }

        // ==========================================
        // 3. UTILITY FUNCTIONS
        // ==========================================
        function compressImage(file, callback) {
            if (!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    callback(dataUrl);
                }
            }
        }

        function renderStars(rating, size = 16) {
            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                if (i <= rating) {
                    starsHtml += `<i data-lucide="star" width="${size}" height="${size}" class="text-yellow-400 fill-yellow-400"></i>`;
                } else {
                    starsHtml += `<i data-lucide="star" width="${size}" height="${size}" class="text-gray-200 fill-gray-200"></i>`;
                }
            }
            return `<div class="flex gap-0.5 items-center justify-center">${starsHtml}</div>`;
        }
        
        function maskName(name) {
            if (!name) return "***";
            const trimmed = name.trim();
            if (trimmed.length <= 2) return trimmed.charAt(0) + "***";
            return trimmed.substring(0, 2) + "***" + trimmed.charAt(trimmed.length - 1);
        }

        function getPaginationArray(current, total) {
            if (total <= 5) return Array.from({length: total}, (_, i) => i + 1);
            if (current <= 3) return [1, 2, 3, 4, '...', total];
            if (current >= total - 2) return [1, '...', total - 3, total - 2, total - 1, total];
            return [1, '...', current - 1, current, current + 1, '...', total];
        }

        function renderFilterUI(currentFilter, viewType) {

                { value: 3, label: '3 ดาว' },

            return `

        function renderPaginationUI(currentPage, totalPages, viewType) {

                                            <option value="message-circle" ${link.type=='message-circle'?'selected':''}>Line/Chat</option>
                                            <option value="twitter" ${link.type=='twitter'?'selected':''}>Twitter</option>
                                            <option value="youtube" ${link.type=='youtube'?'selected':''}>YouTube</option>
                                            <option value="link" ${link.type=='link'?'selected':''}>Other</option>
                                        </select>
                                        <input type="text" placeholder="ชื่อปุ่ม" value="${escapeHTML(link.label)}" oninput="updateSocialLink('${link.id}', 'label', this.value)" class="flex-[1] px-3 py-2 bg-white/70 border border-gray-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-purple-300 min-w-[100px]">
                                        <input type="text" placeholder="URL ลิ้งค์..." value="${escapeHTML(link.url)}" oninput="updateSocialLink('${link.id}', 'url', this.value)" class="flex-[2] px-3 py-2 bg-white/70 border border-gray-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-purple-300 min-w-[150px]">
                                        <button onclick="deleteSocialLink('${link.id}')" class="p-2 text-red-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors shrink-0">
                                            <i data-lucide="trash-2" width="16" height="16"></i>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                            <button onclick="addSocialLink()" class="px-4 py-2.5 bg-purple-50 text-purple-600 rounded-xl text-xs sm:text-sm font-medium cursor-pointer hover:bg-purple-100 transition-colors border border-purple-100 flex items-center gap-1.5 w-full sm:w-auto justify-center">
                                <i data-lucide="plus" width="14" height="14"></i> เพิ่มช่องทางติดต่อ
                            </button>
                        </div>

                        <div class="pt-4 text-center border-t border-gray-100">
                            <span id="save-status-indicator" class="inline-flex items-center gap-1 text-xs sm:text-sm text-emerald-600 bg-emerald-50 px-4 py-2 rounded-full font-medium border border-emerald-100 shadow-sm transition-all duration-300">
                                <i data-lucide="check-circle-2" class="w-4 h-4"></i> ข้อมูลบันทึกอัตโนมัติเรียบร้อย
                            </span>
                        </div>
                    </div>
                `;
            } else {
                let filteredAdminReviews = reviews;
                if (adminFilter !== 'all') {
                    filteredAdminReviews = filteredAdminReviews.filter(r => r.rating === parseInt(adminFilter));
                }

                const totalPages = Math.ceil(filteredAdminReviews.length / itemsPerPage);
                const startIndex = (adminPage - 1) * itemsPerPage;
                const endIndex = startIndex + itemsPerPage;
                const currentAdminReviews = filteredAdminReviews.slice(startIndex, endIndex);

                html += `
                    <div class="flex items-center justify-between mb-2 ml-1">
                        <div class="text-sm font-medium text-gray-500">รีวิวทั้งหมด (${filteredAdminReviews.length})</div>
                    </div>
                    
                    ${renderFilterUI(adminFilter, 'admin')}

                    <div class="space-y-4">
                        ${currentAdminReviews.length === 0 ? `
                            <div class="text-center text-gray-400 py-8 glass-card rounded-3xl">ไม่มีรีวิวในหมวดหมู่นี้</div>
                        ` : currentAdminReviews.map(r => renderReviewCard(r, true)).join('')}
                    </div>

                    ${renderPaginationUI(adminPage, totalPages, 'admin')}
                `;
            }

            html += `</div>`;
            return html;
        }

        // ==========================================
        // 5. ACTIONS & HANDLERS
        // ==========================================
        window.setSaveStatusUI = function(saving) {
            appState.isSaving = saving;
            const el = document.getElementById('save-status-indicator');
            if (el) {
                if (saving) {
                    el.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังบันทึก...';
                    el.classList.add('opacity-50', 'text-purple-600', 'bg-purple-50', 'border-purple-100');
                    el.classList.remove('text-emerald-600', 'bg-emerald-50', 'border-emerald-100');
                } else {
                    el.innerHTML = '<i data-lucide="check-circle-2" class="w-4 h-4"></i> ข้อมูลบันทึกอัตโนมัติเรียบร้อย';
                    el.classList.remove('opacity-50', 'text-purple-600', 'bg-purple-50', 'border-purple-100');
                    el.classList.add('text-emerald-600', 'bg-emerald-50', 'border-emerald-100');
                }
                lucide.createIcons();
            }
        }

        function setReviewFilter(filter, viewType) {
            if (viewType === 'customer') {
                appState.customerFilter = filter;
                appState.customerPage = 1;
            } else {
                appState.adminFilter = filter;
                appState.adminPage = 1;
            }
            renderApp();
        }

        function setPage(page, viewType) {
            if (viewType === 'customer') {
                appState.customerPage = page;
            } else {
                appState.adminPage = page;
            }
            renderApp();
            const scrollArea = document.getElementById('scrollable-content');
            if(scrollArea) scrollArea.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleView() {
            if (appState.view === 'customer') {
                if(appState.isAdmin) appState.view = 'admin';
                else appState.view = 'login';
            } else {
                appState.view = 'customer';
            }
            appState.errorMsg = '';
            appState.isSaving = false; 
            renderApp();
        }

        async function handleLogin(e) {
            e.preventDefault();
            if(appState.isSaving) return;
            
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            
            appState.isSaving = true;
            appState.errorMsg = '';
            renderApp(); 

            try {
                const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
                if (error) throw error;
                
                const { data: isAdmin, error: rpcError } = await sb.rpc('is_admin');
                if (isAdmin === true) {
                    appState.isAdmin = true;
                    appState.view = 'admin';
                    appState.isSaving = false; 
                    await fetchInitialData(); 
                } else {
                    await sb.auth.signOut();
                    throw new Error("บัญชีนี้ไม่มีสิทธิ์เข้าถึงระบบหลังบ้าน");
                }
            } catch (error) {
                appState.errorMsg = error.message || "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
                appState.isSaving = false;
                renderApp();
            }
        }

        async function logoutAdmin() {
            await sb.auth.signOut();
            appState.isAdmin = false;
            appState.view = 'customer';
            appState.isSaving = false;
            appState.errorMsg = '';
            await fetchInitialData(); 
        }

        function setAdminTab(tab) {
            appState.adminTab = tab;
            renderApp();
        }

        let saveTimeout;
        function debouncedUpdateShopInfo(key, value) {
            appState.shopInfo[key] = value;
            setSaveStatusUI(true);
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveShopInfoToDB, 1000);
        }

        async function saveShopInfoToDB() {
            if(!appState.isAdmin) return;
            try {
                const info = appState.shopInfo;
                const { error } = await sb.from('shop_info').upsert({
                    id: 1, 
                    name: info.name,
                    description: info.description,
                    avatar_url: info.avatar,
                    banner_url: info.banner,
                    show_banner: info.showBanner,
                    marquee_text: info.marqueeText,
                    tags: info.tags
                });
                if (error) throw error;
            } catch (error) {
                console.error("เกิดข้อผิดพลาดในการบันทึกข้อมูลร้าน: " + error.message);
            } finally {
                setSaveStatusUI(false);
            }
        }

        window.toggleBannerDisplay = function(isChecked) {
            appState.shopInfo.showBanner = isChecked;
            setSaveStatusUI(true);
            saveShopInfoToDB().then(() => renderApp());
        }

        window.handleAdminImageUpload = function(event, key) {
            const file = event.target.files[0];
            if (file) {
                setSaveStatusUI(true);
                renderApp();
                compressImage(file, (dataUrl) => {
                    appState.shopInfo[key] = dataUrl;
                    saveShopInfoToDB().then(() => renderApp());
                });
            }
        }
        
        window.addTag = function() {
            if (!appState.shopInfo.tags) appState.shopInfo.tags = [];
            if (appState.shopInfo.tags.length < 3) {
                appState.shopInfo.tags.push("แท็กใหม่");
                renderApp();
                saveShopInfoToDB();
            }
        };

        window.updateTag = function(index, value) {
            if (appState.shopInfo.tags && appState.shopInfo.tags[index] !== undefined) {
                appState.shopInfo.tags[index] = value;
                setSaveStatusUI(true);
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(saveShopInfoToDB, 1000);
            }
        };

        window.deleteTag = function(index) {
            if (appState.shopInfo.tags) {
                appState.shopInfo.tags.splice(index, 1);
                renderApp();
                saveShopInfoToDB();
            }
        };

        window.addSocialLink = async function() {
            if(!appState.isAdmin || appState.isSaving) return;
            setSaveStatusUI(true);
            try {
                const newLink = { type: 'link', label: 'Website', url: '' };
                const { data, error } = await sb.from('social_links').insert([newLink]).select().single();
                if (error) throw error;
                
                appState.shopInfo.socialLinks.push({
                    id: data.id,
                    type: data.type,
                    label: data.label,
                    url: data.url
                });
                renderApp();
            } catch (e) {
                alert("เพิ่มช่องทางไม่สำเร็จ: " + e.message);
            } finally {
                setSaveStatusUI(false);
            }
        };

        window.updateSocialLinkType = function(id, value) {
            const link = appState.shopInfo.socialLinks.find(l => l.id === id);
            if(link) {
                link.type = value;
                renderApp();
                updateSocialLinkToDB(id, 'type', value);
            }
        };

        window.updateSocialLink = function(id, field, value) {
            if(!appState.isAdmin) return;
            const link = appState.shopInfo.socialLinks.find(l => l.id === id);
            if(link) {
                link[field] = value;
                updateSocialLinkToDB(id, field, value);
            }
        };
        
        async function updateSocialLinkToDB(id, field, value) {
            setSaveStatusUI(true);
            try {
                const updateData = {};
                updateData[field] = value;
                const { error } = await sb.from('social_links').update(updateData).eq('id', id);
                if(error) throw error;
            } catch (e) {
                console.error("อัปเดตช่องทางไม่สำเร็จ: " + e.message);
            } finally {
                setSaveStatusUI(false);
            }
        }

        window.deleteSocialLink = async function(id) {
            if(!appState.isAdmin || appState.isSaving) return;
            if(confirm('ต้องการลบช่องทางการติดต่อนี้หรือไม่?')) {
                setSaveStatusUI(true);
                try {
                    const { error } = await sb.from('social_links').delete().eq('id', id);
                    if(error) throw error;
                    
                    appState.shopInfo.socialLinks = appState.shopInfo.socialLinks.filter(l => l.id !== id);
                    renderApp();
                } catch(e) {
                    alert("ลบข้อมูลไม่สำเร็จ: " + e.message);
                } finally {
                    setSaveStatusUI(false);
                }
            }
        };

        window.toggleHideReview = async function(id, currentHiddenStatus) {
            if(!appState.isAdmin || appState.isSaving) return;
            appState.isSaving = true;
            try {
                const newStatus = !currentHiddenStatus;
                const { error } = await sb.from('reviews').update({ is_hidden: newStatus }).eq('id', id);
                if(error) throw error;
                
                const review = appState.reviews.find(r => r.id === id);
                if(review) review.isHidden = newStatus;
                renderApp();
            } catch(e) {
                alert("เปลี่ยนสถานะไม่สำเร็จ: " + e.message);
            } finally {
                appState.isSaving = false;
            }
        }

        window.deleteReview = async function(id) {
            if(!appState.isAdmin || appState.isSaving) return;
            if(confirm('คุณแน่ใจหรือไม่ที่จะลบรีวิวนี้? การกระทำนี้ไม่สามารถย้อนกลับได้')) {
                appState.isSaving = true;
                
                try {
                    const { error } = await sb.from('reviews').delete().eq('id', id);
                    if(error) throw error;
                    
                    appState.reviews = appState.reviews.filter(r => r.id !== id);
                    
                    const totalFiltered = appState.adminFilter === 'all' 
                        ? appState.reviews.length 
                        : appState.reviews.filter(r => r.rating === parseInt(appState.adminFilter)).length;
                    const totalPages = Math.ceil(totalFiltered / appState.itemsPerPage);
                    
                    if (appState.adminPage > totalPages && totalPages > 0) {
                        appState.adminPage = totalPages;
                    }
                    renderApp();
                } catch(e) {
                    alert("ลบรีวิวไม่สำเร็จ: " + e.message);
                } finally {
                    appState.isSaving = false;
                }
            }
        }

        // ==========================================
        // 6. MODALS (Customer Review & Admin Reply)
        // ==========================================

        let currentModalState = {};

        function closeModals() {
            document.getElementById('modal-root').innerHTML = '';
        }

        function openReviewModal() {
            currentModalState = { 
                type: 'review',
                rating: 5, 
                text: '', 
                image: null,
                authorName: '',
                hideName: false,
                contactLink: ''
            };
            renderReviewModalHTML(true);
        }

        function saveModalInputs() {
            if(document.getElementById('reviewAuthorInput')) currentModalState.authorName = document.getElementById('reviewAuthorInput').value;
            if(document.getElementById('reviewHideNameCheck')) currentModalState.hideName = document.getElementById('reviewHideNameCheck').checked;
            if(document.getElementById('reviewContactInput')) currentModalState.contactLink = document.getElementById('reviewContactInput').value;
            if(document.getElementById('reviewTextInput')) currentModalState.text = document.getElementById('reviewTextInput').value;
        }

        window.setModalRating = function(rating) {
            currentModalState.rating = rating;
            const container = document.getElementById('starContainer');
            if (container) {
                const btns = container.querySelectorAll('.star-btn');
                btns.forEach((btn, idx) => {
                    const starVal = idx + 1;
                    const el = btn.querySelector('svg') || btn.querySelector('i');
                    if (el) {
                        if (starVal <= rating) {
                            el.setAttribute('class', 'lucide lucide-star text-yellow-400 fill-yellow-400');
                        } else {
                            el.setAttribute('class', 'lucide lucide-star text-gray-200 fill-gray-200');
                        }
                    }
                });
            }
        };

        window.handleModalImage = function(event) {
            const file = event.target.files[0];
            if (file) {
                if (currentModalState.type === 'review') saveModalInputs();
                else if (currentModalState.type === 'reply') {
                    if (document.getElementById('replyTextInput')) {
                        currentModalState.text = document.getElementById('replyTextInput').value;
                    }
                }

                compressImage(file, (dataUrl) => {
                    currentModalState.image = dataUrl;
                    if (currentModalState.type === 'reply') {
                        renderReplyModalHTML(false);
                    } else {
                        renderReviewModalHTML(false);
                    }
                });
            }
        };

        window.removeModalImage = function() {
            if (currentModalState.type === 'review') saveModalInputs();
            else if (currentModalState.type === 'reply') {
                if (document.getElementById('replyTextInput')) {
                    currentModalState.text = document.getElementById('replyTextInput').value;
                }
            }

            currentModalState.image = null;
            if (currentModalState.type === 'reply') {
                renderReplyModalHTML(false);
            } else {
                renderReviewModalHTML(false);
            }
        };

        window.submitReview = async function() {
            if(appState.isSaving) return;
            
            const author = document.getElementById('reviewAuthorInput').value.trim() || "ลูกค้าผู้ไม่ประสงค์ออกนาม";
            const hideName = document.getElementById('reviewHideNameCheck').checked;
            const contactLink = document.getElementById('reviewContactInput').value.trim();
            const text = document.getElementById('reviewTextInput').value;
            
            if(!contactLink) return alert('กรุณาระบุลิ้งค์ช่องทางการติดต่อ (Facebook, Line, IG ฯลฯ) เพื่อยืนยันตัวตนการรีวิวค่ะ');
            if(!text.trim()) return alert('กรุณาพิมพ์ข้อความรีวิวค่ะ');

            appState.isSaving = true;
            renderReviewModalHTML(false); 

            try {
                const insertData = {
                    author: author,
                    hide_name: hideName,
                    contact_link: contactLink,
                    rating: currentModalState.rating,
                    review_text: text,
                    review_image_url: currentModalState.image,
                    is_admin_post: appState.isAdmin
                };

                const { data, error } = await sb.from('reviews').insert([insertData]).select().single();
                if (error) throw error;
                
                const newReview = {
                    id: data.id,
                    author: data.author,
                    hideName: data.hide_name,
                    contactLink: data.contact_link,
                    rating: data.rating,
                    text: data.review_text,
                    image: data.review_image_url,
                    isAdminPost: data.is_admin_post,
                    date: formatDateThai(data.created_at),
                    reply: null,
                    isHidden: false
                };

                appState.reviews.unshift(newReview);
                appState.customerFilter = 'all';
                appState.customerPage = 1;
                
                closeModals();
                renderApp();
            } catch (e) {
                alert('เกิดข้อผิดพลาดในการส่งรีวิว: (หากเพิ่มไม่ได้ ให้ตรวจสอบว่าตาราง reviews มีคอลัมน์ is_admin_post แล้วหรือยัง)');
                appState.isSaving = false;
                renderReviewModalHTML(false);
            }
        };

                        <button type="button" onclick="closeModals()" class="absolute top-5 right-5 text-gray-400 hover:bg-gray-100 p-1.5 rounded-full transition-colors" ${appState.isSaving ? 'disabled' : ''}>

                                <p class="text-xs text-red-400/90 mt-2 ml-2 font-medium">* บังคับกรอก เพื่อยืนยันตัวตนและป้องกันการปั่นรีวิว</p>

            document.getElementById('modal-root').innerHTML = html;
            setTimeout(() => lucide.createIcons(), 0);

        // --- Admin Reply Modal ---
        function openReplyModal(reviewId) {
            const review = appState.reviews.find(r => r.id === reviewId);
            currentModalState = { 
                type: 'reply',
                reviewId: reviewId, 
                text: review.reply ? review.reply.text : '', 
                image: review.reply ? review.reply.image : null 
            };
            renderReplyModalHTML(true);
        }

        window.submitReply = async function() {
            if(!appState.isAdmin || appState.isSaving) return;
            
            const text = document.getElementById('replyTextInput').value;
            const reviewId = currentModalState.reviewId;
            const reviewIndex = appState.reviews.findIndex(r => r.id === reviewId);
            
            if (reviewIndex > -1) {
                appState.isSaving = true;
                renderReplyModalHTML(false); 
                
                try {
                    let updateData = {};
                    if (!text.trim() && !currentModalState.image) {
                        updateData = { reply_text: null, reply_image_url: null, reply_date: null };
                    } else {
                        updateData = { 
                            reply_text: text, 
                            reply_image_url: currentModalState.image, 
                            reply_date: new Date().toISOString() 
                        };
                    }
                    
                    const { error } = await sb.from('reviews').update(updateData).eq('id', reviewId);
                    if (error) throw error;
                    
                    if (!text.trim() && !currentModalState.image) {
                        appState.reviews[reviewIndex].reply = null;
                    } else {
                        appState.reviews[reviewIndex].reply = {
                            text: text,
                            image: currentModalState.image,
                            date: formatDateThai(updateData.reply_date)
                        };
                    }
                    closeModals();
                    renderApp();
                } catch (e) {
                    alert("บันทึกตอบกลับไม่สำเร็จ: " + e.message);
                    appState.isSaving = false;
                    renderReplyModalHTML(false);
                }
            }
        }

        function renderReplyModalHTML(animate = true) {
            const { text, image } = currentModalState;
            const textValue = document.getElementById('replyTextInput') ? document.getElementById('replyTextInput').value : text;

            let html = `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/50 backdrop-blur-sm ${animate ? 'animate-fade-in' : ''}">
                    <div class="absolute inset-0" onclick="${appState.isSaving ? '' : 'closeModals()'}"></div>
                    
                    <div class="bg-white w-full max-w-lg mx-auto rounded-[36px] p-7 sm:p-8 shadow-2xl relative z-10 border border-white ${animate ? 'animate-slide-up' : ''}">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="font-bold text-gray-800 text-xl flex items-center gap-2">
                                <i data-lucide="message-circle" width="24" height="24" class="text-pink-500"></i> ตอบกลับรีวิว
                            </h3>
                            <button type="button" onclick="closeModals()" class="p-2 text-gray-400 bg-gray-100 hover:bg-gray-200 rounded-full transition-colors" ${appState.isSaving ? 'disabled' : ''}>
                                <i data-lucide="x" width="18" height="18"></i>
                            </button>
                        </div>
                        
                        <textarea id="replyTextInput" class="w-full bg-gray-50 border border-gray-200 rounded-[20px] p-5 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-pink-300 resize-none h-32 mb-5 placeholder-gray-400" placeholder="พิมพ์คำตอบของคุณ..." ${appState.isSaving ? 'disabled' : ''}>${escapeHTML(textValue)}</textarea>

                        <div class="flex flex-wrap sm:flex-nowrap justify-between items-end gap-4 mb-4">
                            <div>
                                ${image ? `
                                <div class="relative inline-block">
                                    <img src="${escapeHTML(image)}" class="h-20 sm:h-24 rounded-xl border-2 border-white shadow-sm object-cover" />
                                    <button type="button" onclick="removeModalImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1.5 shadow-sm hover:bg-red-600" ${appState.isSaving ? 'disabled' : ''}><i data-lucide="x" width="12" height="12"></i></button>
                                </div>
                                ` : `
                                <label class="cursor-pointer text-sm sm:text-base font-semibold text-pink-600 flex items-center gap-2 bg-pink-50 border border-pink-100 px-5 py-3 rounded-xl hover:bg-pink-100 transition-colors ${appState.isSaving ? 'disabled-btn' : ''}">
                                    <i data-lucide="camera" width="18" height="18"></i> แนบรูปภาพ
                                    <input type="file" accept="image/*" class="hidden" onchange="handleModalImage(event)" ${appState.isSaving ? 'disabled' : ''}/>
                                </label>
                                `}
                            </div>
                            <button type="button" onclick="submitReply()" class="w-full sm:w-auto px-8 py-3.5 bg-gray-800 text-white font-medium text-sm sm:text-base rounded-xl hover:bg-gray-700 transition-colors flex items-center justify-center gap-2 shadow-md ${appState.isSaving ? 'disabled-btn' : ''}" ${appState.isSaving ? 'disabled' : ''}>
                                ${appState.isSaving ? '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> บันทึก...' : '<i data-lucide="send" width="18" height="18"></i> บันทึกการตอบกลับ'}
                            </button>
                        </div>
                        <p class="text-xs text-gray-400 text-center bg-gray-50 py-2 rounded-lg mt-2">หากลบข้อความและรูปภาพออก จะเป็นการลบคำตอบ</p>
                    </div>
                </div>
            `;
            document.getElementById('modal-root').innerHTML = html;
            setTimeout(() => lucide.createIcons(), 0);
        }

        // ==========================================
        // 7. INITIALIZATION
        // ==========================================
        window.onload = function() {
            fetchInitialData(); 
        };
    </script>
</body>
</html>
